name: Build JAR
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      - run: mvn clean package
      - uses: actions/upload-artifact@v4
        with:
          name: hdthot-spider
          path: target/*.jar
